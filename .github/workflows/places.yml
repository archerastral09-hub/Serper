name: Serper Places

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Mode test (5 agences seulement)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: serper-places
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scraping
        id: scrape
        env:
          SERPER_API_KEYS: ${{ secrets.SERPER_API_KEYS }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python scrape_places.py --test
          else
            python scrape_places.py --max-minutes 330
          fi

      - name: Sauvegarde (commit de la progression + xlsx)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/progress*.jsonl output/*.xlsx
          git diff --cached --quiet || git commit -m "places: progression $(date -u +%F_%H:%M)"
          git pull --rebase -X ours && git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-places
          path: output/*.xlsx

      - name: Relance automatique s'il reste des agences
        if: ${{ inputs.test != true && steps.scrape.outputs.remaining != '0' && steps.scrape.outputs.alive == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run places.yml -f test=false
